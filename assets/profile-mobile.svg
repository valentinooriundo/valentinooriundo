<svg
  width="720"
  height="900"
  viewBox="0 0 720 900"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="720" y2="900">
      <stop stop-color="#050810"/>
      <stop offset="0.52" stop-color="#08111F"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <radialGradient id="aura">
      <stop stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#3B82F6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#050810" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .sans {
        font-family:
          "Segoe UI Variable",
          "Segoe UI",
          Inter,
          Arial,
          sans-serif;
      }

      .mono {
        font-family:
          "JetBrains Mono",
          "Cascadia Code",
          Consolas,
          monospace;
      }

      .orbit {
        transform-origin: 360px 250px;
        animation: rotate 18s linear infinite;
      }

      .orbitReverse {
        transform-origin: 360px 250px;
        animation: rotateReverse 24s linear infinite;
      }

      .pulse {
        animation: pulse 2.8s ease-in-out infinite;
      }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes rotateReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      @keyframes pulse {
        0%,100% { opacity: .45; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="720" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="360" cy="250" r="270" fill="url(#aura)"/>

  <!-- Outer border -->
  <rect
    x="14"
    y="14"
    width="692"
    height="872"
    rx="26"
    stroke="#1E293B"
    stroke-width="1.5"
  />

  <!-- Header -->
  <text
    x="40"
    y="58"
    fill="#64748B"
    font-size="16"
    class="mono"
  >
    valentinooriundo / portfolio
  </text>

  <circle
    cx="666"
    cy="50"
    r="6"
    fill="#22C55E"
    class="pulse"
  />

  <!-- Personal logo -->
  <g>
    <circle
      cx="360"
      cy="250"
      r="95"
      stroke="#22D3EE"
      stroke-width="1.5"
      stroke-dasharray="7 12"
      opacity=".55"
      class="orbit"
    />

    <ellipse
      cx="360"
      cy="250"
      rx="118"
      ry="45"
      stroke="#8B5CF6"
      stroke-width="1.5"
      opacity=".45"
      class="orbitReverse"
    />

    <circle
      cx="360"
      cy="250"
      r="72"
      fill="#081525"
      stroke="url(#accent)"
      stroke-width="3"
      filter="url(#glow)"
    />

    <text
      x="360"
      y="268"
      text-anchor="middle"
      fill="#F8FAFC"
      font-size="54"
      font-weight="750"
      letter-spacing="-3"
      class="sans"
    >
      VO
    </text>

    <circle
      cx="360"
      cy="155"
      r="6"
      fill="#22D3EE"
      filter="url(#glow)"
      class="pulse"
    />

    <circle
      cx="454"
      cy="250"
      r="5"
      fill="#8B5CF6"
      filter="url(#glow)"
      class="pulse"
    />

    <circle
      cx="288"
      cy="305"
      r="4"
      fill="#38BDF8"
      class="pulse"
    />
  </g>

  <!-- Main text -->
  <text
    x="360"
    y="390"
    text-anchor="middle"
    fill="#64748B"
    font-size="14"
    font-weight="600"
    letter-spacing="3"
    class="sans"
  >
    DATA PORTFOLIO
  </text>

  <text
    x="360"
    y="450"
    text-anchor="middle"
    fill="#F8FAFC"
    font-size="42"
    font-weight="750"
    class="sans"
  >
    Valentino Oriundo
  </text>

  <text
    x="360"
    y="492"
    text-anchor="middle"
    fill="#CBD5E1"
    font-size="24"
    font-weight="500"
    class="sans"
  >
    Systems Engineer
  </text>

  <text
    x="360"
    y="545"
    text-anchor="middle"
    fill="#22D3EE"
    font-size="23"
    font-weight="600"
    class="sans"
  >
    Data Analytics
  </text>

  <text
    x="360"
    y="580"
    text-anchor="middle"
    fill="#60A5FA"
    font-size="23"
    font-weight="600"
    class="sans"
  >
    Business Intelligence
  </text>

  <text
    x="360"
    y="615"
    text-anchor="middle"
    fill="#A78BFA"
    font-size="23"
    font-weight="600"
    class="sans"
  >
    Data Science
  </text>

  <text
    x="360"
    y="670"
    text-anchor="middle"
    fill="#94A3B8"
    font-size="18"
    class="sans"
  >
    SQL  •  Power BI  •  Python  •  Excel
  </text>

  <!-- EvoCodeTeam badge -->
  <g transform="translate(170 735)">
    <rect
      width="380"
      height="100"
      rx="20"
      fill="#08111F"
      stroke="#1E293B"
    />

    <circle
      cx="45"
      cy="40"
      r="18"
      fill="#2563EB"
    />

    <path
      d="M30 39C38 29 51 28 60 35"
      stroke="#67E8F9"
      stroke-width="5"
      stroke-linecap="round"
    />

    <ellipse
      cx="45"
      cy="40"
      rx="28"
      ry="9"
      fill="none"
      stroke="#E2E8F0"
      stroke-width="4"
      transform="rotate(-18 45 40)"
    />

    <circle
      cx="67"
      cy="22"
      r="4"
      fill="#F97316"
    />

    <text
      x="85"
      y="38"
      fill="#F8FAFC"
      font-size="18"
      font-weight="750"
      class="sans"
    >
      EVOCODE
    </text>

    <text
      x="85"
      y="59"
      fill="#94A3B8"
      font-size="12"
      font-weight="700"
      letter-spacing="3"
      class="sans"
    >
      TEAM
    </text>

    <text
      x="190"
      y="82"
      text-anchor="middle"
      fill="#64748B"
      font-size="13"
      class="mono"
    >
      MEMBER
    </text>
  </g>
</svg>
