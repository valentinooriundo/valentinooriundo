  <text x="478" y="428" fill="#94A3B8" font-size="12" class="small">current learning trajectory</text>

  <!-- Chart axes -->
  <line x1="492" y1="525" x2="850" y2="525" stroke="#334155" stroke-width="1.5"/>
  <line x1="492" y1="455" x2="850" y2="455" stroke="#1E293B" stroke-width="1"/>
  <line x1="492" y1="490" x2="850" y2="490" stroke="#1E293B" stroke-width="1"/>

  <!-- bars -->
  <rect x="520" y="482" width="34" height="43" rx="6" fill="#22D3EE" class="float1"/>
  <rect x="590" y="458" width="34" height="67" rx="6" fill="#60A5FA" class="float2"/>
  <rect x="660" y="432" width="34" height="93" rx="6" fill="#818CF8" class="float3"/>
  <rect x="730" y="405" width="34" height="120" rx="6" fill="#A78BFA" class="float2"/>
