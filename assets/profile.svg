<svg
  width="1400"
  height="420"
  viewBox="0 0 1400 420"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="420">
      <stop stop-color="#050810"/>
      <stop offset="0.5" stop-color="#08111F"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <radialGradient id="aura">
      <stop stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#3B82F6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#050810" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .sans {
        font-family:
          "Segoe UI Variable",
          "Segoe UI",
          Inter,
          Arial,
          sans-serif;
      }

      .mono {
        font-family:
          "JetBrains Mono",
          "Cascadia Code",
          Consolas,
          monospace;
      }

      .orbit {
        transform-origin: 230px 210px;
        animation: rotate 18s linear infinite;
      }

      .orbitReverse {
        transform-origin: 230px 210px;
        animation: rotateReverse 25s linear infinite;
      }

      .pulse {
        animation: pulse 2.8s ease-in-out infinite;
      }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes rotateReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      @keyframes pulse {
        0%,100% { opacity: .45; }
        50% { opacity: 1; }
      }
    </style>

  </defs>

  <!-- BACKGROUND -->

  <rect
    width="1400"
    height="420"
    rx="28"
    fill="url(#bg)"
  />

  <circle
    cx="230"
    cy="210"
    r="245"
    fill="url(#aura)"
  />

  <!-- BORDER -->

  <rect
    x="10"
    y="10"
    width="1380"
    height="400"
    rx="22"
    stroke="#1E293B"
    stroke-width="1.5"
  />

  <!-- ========================= -->
  <!-- PERSONAL LOGO -->
  <!-- ========================= -->

  <g>

    <!-- outer orbit -->

    <circle
      cx="230"
      cy="210"
      r="105"
      stroke="#22D3EE"
      stroke-width="1.5"
      stroke-dasharray="7 12"
      opacity=".55"
      class="orbit"
    />

    <!-- secondary orbit -->

    <ellipse
      cx="230"
      cy="210"
      rx="130"
      ry="52"
      stroke="#8B5CF6"
      stroke-width="1.5"
      opacity=".45"
      class="orbitReverse"
    />

    <!-- core -->

    <circle
      cx="230"
      cy="210"
      r="76"
      fill="#081525"
      stroke="url(#accent)"
      stroke-width="3"
      filter="url(#glow)"
    />

    <!-- VO -->

    <text
      x="230"
      y="226"
      text-anchor="middle"
      fill="#F8FAFC"
      font-size="53"
      font-weight="750"
      letter-spacing="-3"
      class="sans"
    >
      VO
    </text>

    <!-- orbit points -->

    <circle
      cx="230"
      cy="105"
      r="6"
      fill="#22D3EE"
      filter="url(#glow)"
      class="pulse"
    />

    <circle
      cx="335"
      cy="210"
      r="5"
      fill="#8B5CF6"
      filter="url(#glow)"
      class="pulse"
    />

    <circle
      cx="148"
      cy="275"
      r="4"
      fill="#38BDF8"
      class="pulse"
    />

  </g>


  <!-- ========================= -->
  <!-- PROFILE -->
  <!-- ========================= -->

  <text
    x="420"
    y="127"
    fill="#64748B"
    font-size="13"
    font-weight="600"
    letter-spacing="3"
    class="sans"
  >
    DATA PORTFOLIO
  </text>

  <text
    x="420"
    y="184"
    fill="#F8FAFC"
    font-size="46"
    font-weight="750"
    class="sans"
  >
    Valentino Oriundo
  </text>

  <text
    x="420"
    y="227"
    fill="#CBD5E1"
    font-size="22"
    font-weight="500"
    class="sans"
  >
    Systems Engineer
  </text>

  <text
    x="420"
    y="269"
    fill="#22D3EE"
    font-size="21"
    font-weight="600"
    class="sans"
  >
    Data Analytics
  </text>

  <text
    x="565"
    y="269"
    fill="#475569"
    font-size="21"
    class="sans"
  >
    •
  </text>

  <text
    x="590"
    y="269"
    fill="#60A5FA"
    font-size="21"
    font-weight="600"
    class="sans"
  >
    Business Intelligence
  </text>

  <text
    x="815"
    y="269"
    fill="#475569"
    font-size="21"
    class="sans"
  >
    •
  </text>

  <text
    x="840"
    y="269"
    fill="#A78BFA"
    font-size="21"
    font-weight="600"
    class="sans"
  >
    Data Science
  </text>

  <text
    x="420"
    y="316"
    fill="#94A3B8"
    font-size="16"
    class="sans"
  >
    SQL  •  Power BI  •  Python  •  Excel
  </text>


  <!-- ========================= -->
  <!-- EVOCODETEAM -->
  <!-- ========================= -->

  <g transform="translate(1115 155)">

    <rect
      width="205"
      height="110"
      rx="18"
      fill="#08111F"
      stroke="#1E293B"
    />

    <!-- small planet mark -->

    <circle
      cx="45"
      cy="42"
      r="19"
      fill="#2563EB"
    />

    <path
      d="M29 41C38 29 52 28 62 36"
      stroke="#67E8F9"
      stroke-width="5"
      stroke-linecap="round"
    />

    <ellipse
      cx="45"
      cy="42"
      rx="30"
      ry="10"
      fill="none"
      stroke="#E2E8F0"
      stroke-width="4"
      transform="rotate(-18 45 42)"
    />

    <circle
      cx="69"
      cy="23"
      r="4"
      fill="#F97316"
    />

    <text
      x="83"
      y="40"
      fill="#F8FAFC"
      font-size="15"
      font-weight="750"
      class="sans"
    >
      EVOCODE
    </text>

    <text
      x="84"
      y="59"
      fill="#94A3B8"
      font-size="11"
      font-weight="700"
      letter-spacing="3"
      class="sans"
    >
      TEAM
    </text>

    <text
      x="102"
      y="88"
      text-anchor="middle"
      fill="#64748B"
      font-size="11"
      class="mono"
    >
      MEMBER
    </text>

  </g>

</svg>
