    <rect x="530" y="330" width="220" height="108" rx="18" fill="#091525" stroke="#22D3EE" stroke-opacity="0.4"/>
    <text x="555" y="360" fill="#22D3EE" font-size="11" font-weight="700" letter-spacing="2" class="sans">ANALYTICS STACK</text>
    <text x="555" y="392" fill="#F8FAFC" font-size="18" font-weight="650" class="sans">SQL • Power BI</text>
    <text x="555" y="417" fill="#94A3B8" font-size="14" class="sans">Excel • DAX • Power Query</text>
