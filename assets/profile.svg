<svg
  width="1200"
  height="520"
  viewBox="0 0 1200 520"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>
    <linearGradient id="borderGradient" x1="0" y1="0" x2="1200" y2="520">
      <stop stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect
    width="1200"
    height="520"
    rx="24"
    fill="#0D1117"
  />

  <!-- Border -->
