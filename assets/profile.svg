    <ellipse cx="165" cy="478" rx="28" ry="30" fill="#7B5B42"/>
    <ellipse cx="330" cy="478" rx="28" ry="30" fill="#7B5B42"/>

    <ellipse cx="165" cy="489" rx="14" ry="16" fill="#F0E7DD"/>
    <ellipse cx="330" cy="489" rx="14" ry="16" fill="#F0E7DD"/>
    <circle cx="152" cy="472" r="5.5" fill="#F0E7DD"/>
    <circle cx="162" cy="466" r="5.5" fill="#F0E7DD"/>
    <circle cx="176" cy="467" r="5.5" fill="#F0E7DD"/>
    <circle cx="341" cy="472" r="5.5" fill="#F0E7DD"/>
    <circle cx="331" cy="466" r="5.5" fill="#F0E7DD"/>
