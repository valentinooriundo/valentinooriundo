  <text x="530" y="132" fill="#64748B" font-size="12" letter-spacing="3" class="sans">PROFESSIONAL PROFILE</text>

  <text x="530" y="188" fill="#F8FAFC" font-size="48" font-weight="800" class="sans">VALENTINO ORIUNDO</text>
  <text x="530" y="225" fill="#94A3B8" font-size="20" class="sans">Systems Engineer</text>

  <text x="530" y="262" fill="#22D3EE" font-size="23" font-weight="650" class="sans">Data Analytics</text>
  <text x="700" y="262" fill="#64748B" font-size="23" class="sans">•</text>
  <text x="724" y="262" fill="#60A5FA" font-size="23" font-weight="650" class="sans">Business Intelligence</text>
  <text x="975" y="262" fill="#64748B" font-size="23" class="sans">•</text>
  <text x="999" y="262" fill="#A78BFA" font-size="23" font-weight="650" class="sans">Data Science</text>

  <text x="530" y="295" fill="#CBD5E1" font-size="16" class="sans">Transforming data into insights and intelligent decisions.</text>

  <!-- cards -->
