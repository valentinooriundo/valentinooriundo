      stroke="#00E5FF"
    />

    <path
      d="
        M70 0V620
        M140 0V620
        M210 0V620
        M280 0V620
        M350 0V620
        M420 0V620
        M490 0V620
        M560 0V620
        M630 0V620
        M700 0V620
        M770 0V620
        M840 0V620
        M910 0V620
        M980 0V620
        M1050 0V620
        M1120 0V620
        M1190 0V620
        M1260 0V620
        M1330 0V620
      "
      stroke="#6366F1"
    />
  </g>

