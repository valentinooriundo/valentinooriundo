  <text x="478" y="294" fill="#F8FAFC" font-size="24" class="title">SQL · Python</text>
  <text x="478" y="322" fill="#A5B4FC" font-size="15" class="small">Power BI · Excel · Pandas</text>
  <circle cx="655" cy="265" r="5" fill="#22D3EE" class="pulse"/>

  <rect x="704" y="236" width="250" height="118" rx="18" fill="#0E1A2D" stroke="#22324D" filter="url(#softShadow)"/>
