  <text x="537" y="545" text-anchor="middle" fill="#94A3B8" font-size="11" class="small">SQL</text>
  <text x="607" y="545" text-anchor="middle" fill="#94A3B8" font-size="11" class="small">PBI</text>
  <text x="677" y="545" text-anchor="middle" fill="#94A3B8" font-size="11" class="small">Python</text>
  <text x="747" y="545" text-anchor="middle" fill="#94A3B8" font-size="11" class="small">EDA</text>
  <text x="817" y="545" text-anchor="middle" fill="#94A3B8" font-size="11" class="small">ML</text>

  <!-- roadmap card -->
  <rect x="904" y="378" width="304" height="182" rx="18" fill="#0E1A2D" stroke="#22324D"/>
  <text x="926" y="406" fill="#F8FAFC" font-size="16" class="label">Execution Path</text>
  <text x="926" y="429" fill="#94A3B8" font-size="12" class="small">where data becomes value</text>

  <text x="926" y="462" fill="#67E8F9" font-size="14" class="mono">01  Data Cleaning</text>
  <text x="926" y="487" fill="#60A5FA" font-size="14" class="mono">02  Exploratory Analysis</text>
  <text x="926" y="512" fill="#A78BFA" font-size="14" class="mono">03  Visualization &amp; BI</text>
  <text x="926" y="537" fill="#34D399" font-size="14" class="mono">04  Statistical Thinking</text>

  <text x="926" y="567" fill="#E2E8F0" font-size="14" class="mono">
