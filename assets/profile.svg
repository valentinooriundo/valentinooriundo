    <rect x="180" y="230" width="16" height="54" rx="6" fill="#60A5FA"/>
    <rect x="202" y="216" width="16" height="68" rx="6" fill="#8B5CF6"/>
    <rect x="224" y="248" width="16" height="36" rx="6" fill="#34D399"/>
  </g>

  <!-- capybara group -->
  <g class="float">
    <!-- shadow -->
    <ellipse cx="248" cy="525" rx="125" ry="26" fill="#08111F"/>

    <!-- ears -->
    <ellipse cx="190" cy="210" rx="34" ry="42" fill="#8E6A4B"/>
    <ellipse cx="190" cy="210" rx="22" ry="28" fill="#B08360"/>
    <ellipse cx="305" cy="210" rx="34" ry="42" fill="#8E6A4B"/>
    <ellipse cx="305" cy="210" rx="22" ry="28" fill="#B08360"/>

    <!-- hoodie back -->
    <ellipse cx="248" cy="335" rx="120" ry="118" fill="#2A334C"/>
    <ellipse cx="248" cy="334" rx="100" ry="98" fill="#394564"/>

