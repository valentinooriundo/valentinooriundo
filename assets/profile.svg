    <text x="795" y="360" fill="#818CF8" font-size="11" font-weight="700" letter-spacing="2" class="sans">DATA TOOLKIT</text>
    <text x="795" y="392" fill="#F8FAFC" font-size="18" font-weight="650" class="sans">Python • Pandas</text>
    <text x="795" y="417" fill="#94A3B8" font-size="14" class="sans">NumPy • Matplotlib</text>
