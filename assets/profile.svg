    y="4"
    width="1192"
    height="512"
    rx="22"
    stroke="url(#borderGradient)"
    stroke-width="3"
  />

  <!-- Terminal header -->
  <circle cx="35" cy="34" r="8" fill="#FF5F56"/>
  <circle cx="62" cy="34" r="8" fill="#FFBD2E"/>
  <circle cx="89" cy="34" r="8" fill="#27C93F"/>

  <text
    x="600"
    y="39"
    text-anchor="middle"
    fill="#8B949E"
    font-size="16"
    font-family="monospace"
