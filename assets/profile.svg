  <text x="726" y="296" fill="#F8FAFC" font-size="20" class="title">From dashboards</text>
  <text x="726" y="322" fill="#F8FAFC" font-size="20" class="title">to predictive thinking</text>

  <rect x="972" y="236" width="236" height="118" rx="18" fill="#0E1A2D" stroke="#22324D" filter="url(#softShadow)"/>
