<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#08111F"/>
      <animate attributeName="x2" values="1280;1000;1280" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="chipGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1B33"/>
      <stop offset="100%" stop-color="#101C2E"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#22D3EE" flood-opacity="0.12"/>
    </filter>

    <style>
      .title {
        font-family: 'Segoe UI', 'Inter', 'Arial', sans-serif;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .subtitle {
        font-family: 'Segoe UI', 'Inter', 'Arial', sans-serif;
        font-weight: 500;
      }
      .mono {
        font-family: Consolas, 'Courier New', monospace;
      }
      .label {
        font-family: 'Segoe UI', 'Inter', 'Arial', sans-serif;
        font-weight: 600;
      }
      .small {
        font-family: 'Segoe UI', 'Inter', 'Arial', sans-serif;
        font-weight: 500;
      }
      .float1 {
        animation: float1 5s ease-in-out infinite;
      }
      .float2 {
        animation: float2 6s ease-in-out infinite;
      }
      .float3 {
        animation: float3 7s ease-in-out infinite;
      }
      @keyframes float1 {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes float2 {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
      @keyframes float3 {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .pulse {
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      .blink {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" rx="28" fill="url(#bgGradient)"/>

  <!-- Decorative grid -->
  <g opacity="0.08">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280" stroke="#7DD3FC"/>
    <path d="M80 0V640M160 0V640M240 0V640M320 0V640M400 0V640M480 0V640M560 0V640M640 0V640M720 0V640M800 0V640M880 0V640M960 0V640M1040 0V640M1120 0V640M1200 0V640" stroke="#7DD3FC"/>
  </g>

  <!-- Main border -->
  <rect x="12" y="12" width="1256" height="616" rx="22" stroke="url(#lineGradient)" stroke-width="2.2" opacity="0.95"/>

  <!-- Top glow line -->
  <rect x="28" y="26" width="1224" height="1.5" fill="url(#lineGradient)" opacity="0.8" filter="url(#glow)"/>

  <!-- Terminal header -->
  <circle cx="52" cy="52" r="7" fill="#FF5F56"/>
  <circle cx="76" cy="52" r="7" fill="#FFBD2E"/>
  <circle cx="100" cy="52" r="7" fill="#27C93F"/>

  <text x="640" y="58" text-anchor="middle" fill="#93A4C3" font-size="16" class="mono">
    valentino@analytics-lab:~$
  </text>

  <!-- Left Panel -->
  <rect x="42" y="92" width="360" height="500" rx="22" fill="#0C1628" opacity="0.88" stroke="#1E293B"/>

  <text x="66" y="126" fill="#22D3EE" font-size="18" class="mono">$ profile.load()</text>

  <text x="66" y="165" fill="#7DD3FC" font-size="14" class="mono">
    <tspan x="66" dy="0">██╗   ██╗ █████╗ ██╗     ███████╗</tspan>
    <tspan x="66" dy="22">██║   ██║██╔══██╗██║     ██╔════╝</tspan>
    <tspan x="66" dy="22">██║   ██║███████║██║     █████╗  </tspan>
    <tspan x="66" dy="22">╚██╗ ██╔╝██╔══██║██║     ██╔══╝  </tspan>
    <tspan x="66" dy="22"> ╚████╔╝ ██║  ██║███████╗███████╗</tspan>
    <tspan x="66" dy="22">  ╚═══╝  ╚═╝  ╚═╝╚══════╝╚══════╝</tspan>
  </text>

  <text x="66" y="335" fill="#E2E8F0" font-size="28" class="title">VALENTINO</text>
  <text x="66" y="370" fill="#A5B4FC" font-size="28" class="title">ORIUNDO FLORES</text>
  <text x="66" y="408" fill="#22D3EE" font-size="16" class="subtitle">Systems Engineer</text>
  <text x="66" y="432" fill="#C084FC" font-size="16" class="subtitle">Data Analytics → Data Science</text>

  <rect x="66" y="465" width="120" height="36" rx="18" fill="#0E223A" stroke="#1F3B5C"/>
  <text x="126" y="488" text-anchor="middle" fill="#7DD3FC" font-size="14" class="label">SQL</text>

  <rect x="198" y="465" width="120" height="36" rx="18" fill="#0E223A" stroke="#1F3B5C"/>
  <text x="258" y="488" text-anchor="middle" fill="#7DD3FC" font-size="14" class="label">Power BI</text>

  <rect x="66" y="515" width="120" height="36" rx="18" fill="#0E223A" stroke="#1F3B5C"/>
  <text x="126" y="538" text-anchor="middle" fill="#7DD3FC" font-size="14" class="label">Python</text>

  <rect x="198" y="515" width="120" height="36" rx="18" fill="#0E223A" stroke="#1F3B5C"/>
  <text x="258" y="538" text-anchor="middle" fill="#7DD3FC" font-size="14" class="label">ML Journey</text>

  <!-- Right Main Panel -->
  <rect x="426" y="92" width="812" height="500" rx="22" fill="#0A1323" opacity="0.9" stroke="#1E293B"/>

  <!-- Section Title -->
  <text x="456" y="128" fill="#F8FAFC" font-size="30" class="title">DATA PORTFOLIO OS</text>
  <text x="456" y="154" fill="#94A3B8" font-size="15" class="subtitle">Modern analytics profile • intelligent systems • business insights</text>

  <!-- Top chips -->
  <rect x="456" y="178" width="170" height="34" rx="17" fill="url(#chipGradient)" stroke="#22324D"/>
  <text x="541" y="199" text-anchor="middle" fill="#67E8F9" font-size="13" class="label">Data Analytics</text>

  <rect x="640" y="178" width="160" height="34" rx="17" fill="url(#chipGradient)" stroke="#22324D"/>
