      <path d="M-16 -6C-7 -17 9 -15 17 -5C24 4 23 15 15 22C6 30 -10 29 -18 20C-24 13 -24 2 -16 -6Z" fill="#22C55E"/>
      <path d="M-9 4L-2 -6L8 -5L12 4L2 12L-9 4Z" fill="#F8FAFC"/>
      <path d="M-1 12C4 16 7 20 6 26" stroke="#22C55E" stroke-width="3" stroke-linecap="round"/>
      <path d="M-6 14C-10 18 -13 21 -13 26" stroke="#22C55E" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- paws on laptop -->
    <ellipse cx="204" cy="404" rx="18" ry="12" fill="#8C6748"/>
    <ellipse cx="292" cy="404" rx="18" ry="12" fill="#8C6748"/>
  </g>

  <!-- tiny speech bubble icon -->
  <g transform="translate(352 190)" class="floatSlow">
    <circle cx="0" cy="0" r="24" fill="#EF4444" stroke="#1D4ED8" stroke-width="5"/>
    <path d="M-4 -8C-13 -8 -18 -1 -18 6C-18 11 -15 15 -10 17L-12 24L-4 20C-2 20 0 20 2 20C13 20 20 13 20 4C20 -5 11 -8 -4 -8Z" fill="#EF4444" opacity="0.18"/>
    <circle cx="-8" cy="-2" r="4" fill="#F8FAFC"/>
    <circle cx="8" cy="-2" r="4" fill="#F8FAFC"/>
    <path d="M-8 8C-8 15 -3 18 0 18C3 18 8 15 8 8" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
  </g>

