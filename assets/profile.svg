<svg width="1400" height="620" viewBox="0 0 1400 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- =========================
         GRADIENTS / FILTERS
    ========================== -->
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040816"/>
      <stop offset="45%" stop-color="#08111F"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <radialGradient id="cyanAura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 480) rotate(90) scale(220 320)">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleAura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1100 120) rotate(90) scale(220 360)">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="neonBorder" x1="0" y1="0" x2="1400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="monitorGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#22D3EE" flood-opacity="0.25"/>
    </filter>

    <style>
      .sans {
        font-family: "Segoe UI Variable","Segoe UI",Inter,Arial,sans-serif;
      }
      .mono {
        font-family: "JetBrains Mono","Cascadia Code",Consolas,monospace;
      }
      .float {
        animation: float 5s ease-in-out infinite;
        transform-origin: center;
      }
      .floatSlow {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .pulse {
        animation: pulse 2.1s ease-in-out infinite;
      }
      .blink {
        animation: blink 1s step-end infinite;
      }
      .dash {
        stroke-dasharray: 14 10;
        animation: dashMove 18s linear infinite;
      }
      .scan {
        animation: scanMove 7s linear infinite;
      }
      @keyframes float {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatSlow {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes pulse {
        0%,100% { opacity: .4; }
        50% { opacity: 1; }
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -260; }
      }
      @keyframes scanMove {
        0%   { transform: translateY(-180px); opacity: 0; }
        20%  { opacity: .18; }
        50%  { opacity: .75; }
        80%  { opacity: .18; }
        100% { transform: translateY(180px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- =========================
       BACKGROUND
  ========================== -->
  <rect width="1400" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="230" cy="500" r="220" fill="url(#cyanAura)"/>
  <circle cx="1120" cy="130" r="260" fill="url(#purpleAura)"/>

  <!-- grid -->
  <g opacity="0.07">
    <path d="M0 70H1400 M0 140H1400 M0 210H1400 M0 280H1400 M0 350H1400 M0 420H1400 M0 490H1400 M0 560H1400" stroke="#22D3EE"/>
    <path d="M70 0V620 M140 0V620 M210 0V620 M280 0V620 M350 0V620 M420 0V620 M490 0V620 M560 0V620 M630 0V620 M700 0V620 M770 0V620 M840 0V620 M910 0V620 M980 0V620 M1050 0V620 M1120 0V620 M1190 0V620 M1260 0V620 M1330 0V620" stroke="#6366F1"/>
  </g>

  <!-- outer border -->
  <rect x="10" y="10" width="1380" height="600" rx="24" stroke="url(#neonBorder)" stroke-width="2" class="dash" opacity="0.9"/>

  <!-- corner accents -->
  <path d="M26 95V30H95" stroke="#22D3EE" stroke-width="3" filter="url(#glow)"/>
  <path d="M1305 30H1374V95" stroke="#A78BFA" stroke-width="3" filter="url(#glow)"/>
  <path d="M26 525V590H95" stroke="#22D3EE" stroke-width="3" filter="url(#glow)"/>
  <path d="M1305 590H1374V525" stroke="#A78BFA" stroke-width="3" filter="url(#glow)"/>

  <!-- top bar -->
  <circle cx="46" cy="47" r="6" fill="#FF5F57"/>
  <circle cx="68" cy="47" r="6" fill="#FFBD2E"/>
  <circle cx="90" cy="47" r="6" fill="#28C840"/>

  <text x="700" y="52" text-anchor="middle" fill="#7DD3FC" font-size="14" class="mono">VALENTINO.OS // DATA INTERFACE</text>
  <circle cx="1288" cy="47" r="5" fill="#22C55E" class="pulse"/>
  <text x="1302" y="52" fill="#7DD3FC" font-size="11" class="mono">ONLINE</text>

  <!-- =========================
       LEFT SECTION / CAPYBARA
  ========================== -->

  <!-- cyber avatar panel -->
  <rect x="52" y="98" width="410" height="472" rx="24" fill="#07111F" fill-opacity="0.88" stroke="#0EA5E9" stroke-opacity="0.28"/>

  <text x="78" y="132" fill="#22D3EE" font-size="13" class="mono">IDENTITY_NODE // CAPY-ANALYTICS</text>

  <!-- monitors behind -->
  <g class="floatSlow">
    <rect x="100" y="154" width="120" height="72" rx="10" fill="#081525" stroke="url(#monitorGlow)" stroke-opacity="0.65"/>
    <rect x="240" y="142" width="132" height="78" rx="10" fill="#081525" stroke="url(#monitorGlow)" stroke-opacity="0.65"/>
    <rect x="140" y="222" width="150" height="82" rx="10" fill="#081525" stroke="url(#monitorGlow)" stroke-opacity="0.5"/>

    <path d="M116 208L142 190L163 198L188 176L206 184" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
    <rect x="252" y="156" width="24" height="8" rx="4" fill="#22D3EE"/>
