
<svg
  width="1400"
  height="620"
  viewBox="0 0 1400 620"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- ====================== -->
    <!-- BACKGROUND GRADIENTS -->
    <!-- ====================== -->

    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="620">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <radialGradient id="cyanAura">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleAura">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="neonLine" x1="0" y1="0" x2="1400" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- ====================== -->
    <!-- FILTERS -->
    <!-- ====================== -->

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ====================== -->
    <!-- CSS -->
    <!-- ====================== -->

    <style>

      .sans {
        font-family:
          "Segoe UI Variable",
          "Segoe UI",
          Inter,
          Arial,
          sans-serif;
      }

      .mono {
        font-family:
          "Cascadia Code",
          "JetBrains Mono",
          Consolas,
          monospace;
      }

      .orbitA {
        animation: rotateA 20s linear infinite;
        transform-origin: 220px 255px;
      }

      @keyframes rotateA {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      .orbitB {
        animation: rotateB 14s linear infinite reverse;
        transform-origin: 220px 255px;
      }

      @keyframes rotateB {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      .float {
        animation: float 5s ease-in-out infinite;
      }

      @keyframes float {
        0%,100% { transform: translateY(0px); }
        50%     { transform: translateY(-8px); }
      }

      .floatSlow {
        animation: floatSlow 7s ease-in-out infinite;
      }

      @keyframes floatSlow {
        0%,100% { transform: translateY(0px); }
        50%     { transform: translateY(6px); }
      }

      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,100% { opacity: 0.3; }
        50%     { opacity: 1; }
      }

      .blink {
        animation: blink 1s step-end infinite;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      .dash {
        stroke-dasharray: 14 10;
        animation: dashMove 18s linear infinite;
      }

      @keyframes dashMove {
        to { stroke-dashoffset: -260; }
      }

      .scan {
        animation: scanMove 7s linear infinite;
      }

      @keyframes scanMove {
        0%   { transform: translateY(-220px); opacity: 0; }
        15%  { opacity: 0.4; }
        50%  { opacity: 0.9; }
        85%  { opacity: 0.4; }
        100% { transform: translateY(220px); opacity: 0; }
      }

    </style>

  </defs>

  <!-- ====================== -->
  <!-- MAIN BACKGROUND -->
  <!-- ====================== -->

  <rect width="1400" height="620" rx="28" fill="url(#bg)"/>

  <!-- Ambient light -->

  <circle cx="1120" cy="120" r="320" fill="url(#purpleAura)"/>
  <circle cx="170" cy="490" r="280" fill="url(#cyanAura)"/>

  <!-- ====================== -->
  <!-- GRID -->
  <!-- ====================== -->

  <g opacity="0.07">
    <path
      d="
        M0 70H1400
        M0 140H1400
        M0 210H1400
        M0 280H1400
        M0 350H1400
        M0 420H1400
        M0 490H1400
        M0 560H1400
