    <!-- laptop -->
    <rect x="178" y="388" width="140" height="88" rx="12" fill="#C9CBD9" stroke="#8086A6" stroke-width="3"/>
    <rect x="184" y="394" width="128" height="74" rx="10" fill="#BFC3D7"/>
